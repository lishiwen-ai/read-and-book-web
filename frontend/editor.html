<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品编辑器 · 书写与阅读</title>
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <header class="editor-topbar">
      <a class="back-link" href="./dashboard.html" aria-label="返回工作台">← <span>工作台</span></a>
      <div class="editor-title">
        <span class="editor-kicker">WRITING DESK</span>
        <strong id="work-title">加载中...</strong>
      </div>
      <div class="editor-user">
        <span id="save-status">未保存</span>
        <button id="logout-button" type="button" title="退出登录" aria-label="退出登录">退出</button>
      </div>
    </header>

    <main class="editor-layout">
      <aside class="chapter-sidebar">
        <div class="editor-tabs" role="tablist" aria-label="作品内容">
          <button class="editor-tab active" id="chapters-tab" type="button" role="tab">章节</button>
          <button class="editor-tab" id="characters-tab" type="button" role="tab">人物</button>
        </div>
        <div class="sidebar-heading">
          <div id="chapters-heading">
            <p class="eyebrow">CONTENTS</p>
            <h1>章节</h1>
          </div>
          <div id="characters-heading" class="hidden">
            <p class="eyebrow">CAST</p>
            <h1>人物</h1>
          </div>
          <button class="add-chapter" id="add-chapter" type="button" title="新建章节" aria-label="新建章节">+</button>
        </div>
        <div class="chapter-list" id="chapter-list"></div>
        <div class="character-list hidden" id="character-list"></div>
        <p class="sidebar-message" id="sidebar-message"></p>
      </aside>

      <section class="writing-pane">
        <div class="writing-heading">
          <input id="chapter-title" class="chapter-title" type="text" placeholder="章节标题" maxlength="200" />
          <div class="chapter-tools">
            <span id="word-count">0 字</span>
            <select id="chapter-status" aria-label="章节状态">
              <option value="draft">未写</option>
              <option value="writing">写作中</option>
              <option value="completed">已完成</option>
            </select>
            <button id="delete-chapter" class="editor-action danger" type="button" title="删除章节" aria-label="删除章节">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
              <span>删除</span>
            </button>
          </div>
        </div>
        <textarea id="chapter-content" placeholder="从这里开始写下这一章..."></textarea>
        <div class="writing-footer">
          <span>纯文本编辑</span>
          <button id="save-chapter" class="editor-action save-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 4v6h8V4M8 20v-6h8v6"></path></svg>
            <span>保存章节</span>
          </button>
        </div>
        <p class="editor-message" id="editor-message" role="status"></p>
      </section>

      <section class="character-pane hidden" id="character-pane">
        <div class="character-pane-heading">
          <div>
            <p class="eyebrow">CHARACTER PROFILE</p>
            <h2 id="character-form-title">新增人物</h2>
          </div>
          <button class="editor-action" id="cancel-character" type="button">取消</button>
        </div>
        <form id="character-form" class="character-form">
          <label><span>姓名</span><input id="character-name" required maxlength="100" placeholder="例如：沈砚" /></label>
          <label><span>身份 / 职业</span><input id="character-occupation" maxlength="100" placeholder="例如：边关谋士" /></label>
          <label><span>性别</span><input id="character-gender" maxlength="30" placeholder="例如：男" /></label>
          <label><span>年龄</span><input id="character-age" maxlength="30" placeholder="例如：二十七岁" /></label>
          <label class="wide"><span>性格</span><textarea id="character-personality" maxlength="5000" placeholder="这个人物如何思考和行动？"></textarea></label>
          <label class="wide"><span>外貌特征</span><textarea id="character-appearance" maxlength="5000" placeholder="留下几个最重要的视觉细节。"></textarea></label>
          <label class="wide"><span>人物关系</span><textarea id="character-relationships" maxlength="5000" placeholder="与其他人物的关系、冲突或牵绊。"></textarea></label>
          <label class="wide"><span>背景故事</span><textarea id="character-backstory" maxlength="10000" placeholder="他从哪里来？"></textarea></label>
          <label class="wide"><span>备注</span><textarea id="character-notes" maxlength="5000" placeholder="其他需要记住的设定。"></textarea></label>
          <p class="editor-message" id="character-message" role="status"></p>
          <button class="editor-action save-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 4v6h8V4M8 20v-6h8v6"></path></svg>
            <span>保存人物</span>
          </button>
        </form>
      </section>
    </main>
    <dialog class="confirm-dialog" id="confirm-dialog">
      <div class="confirm-content">
        <p class="eyebrow">CONFIRM DELETE</p>
        <h2 id="confirm-title">确认删除？</h2>
        <p class="dialog-copy" id="confirm-copy"></p>
        <div class="confirm-actions">
          <button class="secondary-button" id="cancel-confirm" type="button">取消</button>
          <button class="danger-button" id="accept-confirm" type="button">确认删除</button>
        </div>
      </div>
    </dialog>
    <dialog class="chapter-dialog" id="chapter-dialog">
      <form id="chapter-form">
        <button class="dialog-close" id="cancel-chapter-dialog" type="button" aria-label="关闭">×</button>
        <p class="eyebrow">NEW CHAPTER</p>
        <h2>创建第一章</h2>
        <p class="dialog-copy">给这一章留下一个名字，正文可以稍后继续。</p>
        <label class="dialog-field">
          <span>章节标题</span>
          <input id="new-chapter-title" type="text" maxlength="200" placeholder="例如：第一章 雁门驿" required />
        </label>
        <p class="editor-message" id="chapter-dialog-message" role="status"></p>
        <div class="dialog-actions">
          <button class="secondary-button" id="cancel-chapter-button" type="button">取消</button>
          <button class="editor-action save-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            <span>创建章节</span>
          </button>
        </div>
      </form>
    </dialog>
    <script src="./editor.js"></script>
  </body>
</html>
