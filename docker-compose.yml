services:
  postgres:
    image: postgres:16-alpine
    container_name: reading-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reading_assistant
      POSTGRES_USER: reading_app
      # 仅用于本地开发；上线时改为强随机密码并用密钥管理服务保存。
      POSTGRES_PASSWORD: local_dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/schema.sql:/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reading_app -d reading_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
